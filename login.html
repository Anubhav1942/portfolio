<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in — Portfolio Platform</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --accent:      #1C3D2B;
      --accent-mid:  #2D6A4F;
      --accent-soft: #52B788;
      --bg:          #F7F5F1;
      --card:        #FFFFFF;
      --text:        #111110;
      --text-sec:    #6A6A66;
      --text-muted:  #9A9A96;
      --border:      #E0DDD7;
      --danger:      #C0392B;
      --radius:      8px;
      --ease:        0.18s ease;
    }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      font-size: 14px;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Card ── */
    .auth-card {
      width: 100%;
      max-width: 400px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: calc(var(--radius) * 2);
      overflow: hidden;
      box-shadow: 0 4px 24px rgba(0,0,0,0.06);
    }

    .auth-logo {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 2rem 1.25rem;
      border-bottom: 1px solid var(--border);
    }

    .auth-logo-mark {
      width: 40px;
      height: 40px;
      background: var(--accent);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Lora', Georgia, serif;
      font-size: 15px;
      font-weight: 600;
      color: #fff;
      letter-spacing: -0.5px;
      margin-bottom: 0.75rem;
    }

    .auth-title {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 0.2rem;
    }

    .auth-subtitle {
      font-size: 0.8rem;
      color: var(--text-sec);
    }

    /* ── Tabs ── */
    .auth-tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
    }

    .auth-tab {
      flex: 1;
      padding: 0.75rem;
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--text-muted);
      background: none;
      border: none;
      cursor: pointer;
      font-family: inherit;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      transition: color var(--ease), border-color var(--ease);
    }

    .auth-tab.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }

    /* ── Forms ── */
    .auth-form-wrap {
      padding: 1.75rem 2rem;
    }

    .auth-view { display: none; }
    .auth-view.active { display: block; }

    .field {
      margin-bottom: 1rem;
    }

    .field label {
      display: block;
      font-size: 0.78rem;
      font-weight: 500;
      color: var(--text-sec);
      margin-bottom: 0.4rem;
    }

    .field input {
      width: 100%;
      padding: 0.6rem 0.85rem;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 0.88rem;
      font-family: inherit;
      color: var(--text);
      background: var(--bg);
      transition: border-color var(--ease), box-shadow var(--ease);
      outline: none;
    }

    .field input:focus {
      border-color: var(--accent-mid);
      box-shadow: 0 0 0 3px rgba(44,106,79,0.12);
    }

    .field input.error {
      border-color: var(--danger);
    }

    .field-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.4rem;
    }

    .field-row label { margin: 0; }

    .link-btn {
      font-size: 0.75rem;
      color: var(--accent-mid);
      background: none;
      border: none;
      cursor: pointer;
      font-family: inherit;
      padding: 0;
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .link-btn:hover { color: var(--accent); }

    .btn-primary {
      width: 100%;
      padding: 0.65rem;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      font-size: 0.88rem;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      transition: background var(--ease);
      margin-top: 0.25rem;
    }

    .btn-primary:hover { background: var(--accent-mid); }
    .btn-primary:disabled { opacity: 0.55; cursor: not-allowed; }

    /* ── Error / info messages ── */
    .auth-message {
      font-size: 0.78rem;
      padding: 0.6rem 0.8rem;
      border-radius: var(--radius);
      margin-bottom: 1rem;
      display: none;
    }

    .auth-message.error {
      background: #fdf0f0;
      color: var(--danger);
      border: 1px solid #f5c6c6;
      display: block;
    }

    .auth-message.success {
      background: #f0faf4;
      color: var(--accent-mid);
      border: 1px solid #b8e6cc;
      display: block;
    }

    /* ── Verify email state ── */
    .verify-card {
      text-align: center;
      padding: 2rem;
    }

    .verify-icon {
      font-size: 2.5rem;
      margin-bottom: 1rem;
    }

    .verify-title {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    .verify-desc {
      font-size: 0.82rem;
      color: var(--text-sec);
      line-height: 1.6;
      margin-bottom: 1.5rem;
    }

    .btn-sec {
      width: 100%;
      padding: 0.6rem;
      background: transparent;
      color: var(--text-sec);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 0.82rem;
      font-family: inherit;
      cursor: pointer;
      transition: border-color var(--ease), color var(--ease);
      margin-top: 0.5rem;
    }

    .btn-sec:hover { border-color: var(--accent-mid); color: var(--accent); }

    .divider {
      text-align: center;
      font-size: 0.72rem;
      color: var(--text-muted);
      margin: 1.25rem 0 0;
    }
  </style>
</head>
<body>

<div class="auth-card" id="authCard">

  <!-- Logo / brand -->
  <div class="auth-logo">
    <div class="auth-logo-mark">AP</div>
    <div class="auth-title" id="cardTitle">Welcome back</div>
    <div class="auth-subtitle" id="cardSubtitle">Sign in to your portfolio admin panel</div>
  </div>

  <!-- Sign in / Sign up tabs -->
  <div class="auth-tabs" id="authTabs">
    <button class="auth-tab active" id="tabSignin" onclick="switchAuthTab('signin')">Sign in</button>
    <button class="auth-tab" id="tabSignup" onclick="switchAuthTab('signup')">Create portfolio</button>
  </div>

  <!-- Forms wrapper -->
  <div class="auth-form-wrap" id="formWrap">

    <!-- ── Sign in ── -->
    <div class="auth-view active" id="viewSignin">
      <div class="auth-message" id="signinMsg"></div>
      <form onsubmit="doSignin(event)">
        <div class="field">
          <label>Email</label>
          <input type="email" id="signinEmail" placeholder="you@example.com" required autocomplete="email" />
        </div>
        <div class="field">
          <div class="field-row">
            <label>Password</label>
            <button type="button" class="link-btn" onclick="switchView('forgot')">Forgot password?</button>
          </div>
          <input type="password" id="signinPassword" placeholder="••••••••" required autocomplete="current-password" />
        </div>
        <button type="submit" class="btn-primary" id="signinBtn">Sign in</button>
      </form>
    </div>

    <!-- ── Sign up ── -->
    <div class="auth-view" id="viewSignup">
      <div class="auth-message" id="signupMsg"></div>
      <form onsubmit="doSignup(event)">
        <div class="field">
          <label>Email</label>
          <input type="email" id="signupEmail" placeholder="you@example.com" required autocomplete="email" />
        </div>
        <div class="field">
          <label>Password</label>
          <input type="password" id="signupPassword" placeholder="Min. 8 characters" required autocomplete="new-password" minlength="8" />
        </div>
        <div class="field">
          <label>Confirm password</label>
          <input type="password" id="signupConfirm" placeholder="Repeat password" required autocomplete="new-password" />
        </div>
        <button type="submit" class="btn-primary" id="signupBtn">Create my portfolio</button>
      </form>
    </div>

    <!-- ── Forgot password ── -->
    <div class="auth-view" id="viewForgot">
      <div class="auth-message" id="forgotMsg"></div>
      <form onsubmit="doResetPassword(event)">
        <div class="field">
          <label>Your email address</label>
          <input type="email" id="forgotEmail" placeholder="you@example.com" required autocomplete="email" />
        </div>
        <button type="submit" class="btn-primary" id="forgotBtn">Send reset link</button>
      </form>
      <div class="divider">
        <button class="link-btn" onclick="switchView('signin')">Back to sign in</button>
      </div>
    </div>

    <!-- ── Verify email ── -->
    <div class="auth-view" id="viewVerify">
      <div class="verify-card">
        <div class="verify-icon">📬</div>
        <div class="verify-title">Check your inbox</div>
        <div class="verify-desc" id="verifyDesc">
          We sent a verification link to your email address. Click it to activate your account, then sign in below.
        </div>
        <button class="btn-primary" onclick="switchAuthTab('signin')">Sign in</button>
        <button class="btn-sec" id="resendBtn" onclick="doResend()">Resend verification email</button>
      </div>
    </div>

  </div>
</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="firebase-config.js"></script>

<script>
  /* ═══════════════════════════════════════
     AUTH PAGE LOGIC
  ═══════════════════════════════════════ */

  var lastSignupUser = null; // hold ref for resend

  /* Redirect if already signed in + email verified */
  firebase.auth().onAuthStateChanged(function (user) {
    if (user && user.emailVerified) {
      window.location.href = (user.email === 'pandeyanubhav229@gmail.com')
        ? 'admin.html'
        : 'dashboard.html';
    }
  });

  /* ── Check URL params ── */
  (function () {
    var params = new URLSearchParams(window.location.search);
    if (params.get('verify') === '1') {
      setVerifyView('Please verify your email before signing in.');
    }
    if (params.get('mode') === 'signup') {
      switchAuthTab('signup');
    }
  })();

  /* ── Tab switching ── */
  function switchAuthTab(tab) {
    document.getElementById('tabSignin').classList.toggle('active', tab === 'signin');
    document.getElementById('tabSignup').classList.toggle('active', tab === 'signup');
    switchView(tab === 'signin' ? 'signin' : 'signup');
    document.getElementById('cardTitle').textContent    = tab === 'signin' ? 'Welcome back' : 'Create your portfolio';
    document.getElementById('cardSubtitle').textContent = tab === 'signin'
      ? 'Sign in to your portfolio admin panel'
      : 'Free to start — your portfolio, your domain';
  }

  /* ── View switching (signin / signup / forgot / verify) ── */
  function switchView(viewId) {
    document.querySelectorAll('.auth-view').forEach(function (v) { v.classList.remove('active'); });
    document.getElementById('view' + viewId.charAt(0).toUpperCase() + viewId.slice(1)).classList.add('active');
    // Show/hide tabs
    var hideTabs = (viewId === 'forgot' || viewId === 'verify');
    document.getElementById('authTabs').style.display = hideTabs ? 'none' : '';
  }

  function setVerifyView(desc) {
    if (desc) document.getElementById('verifyDesc').textContent = desc;
    document.getElementById('cardTitle').textContent    = 'Almost there';
    document.getElementById('cardSubtitle').textContent = 'One last step';
    switchView('verify');
  }

  /* ── Helpers ── */
  function setMsg(id, msg, type) {
    var el = document.getElementById(id);
    el.textContent    = msg;
    el.className      = 'auth-message ' + (type || 'error');
  }

  function clearMsg(id) {
    var el = document.getElementById(id);
    el.className  = 'auth-message';
    el.textContent = '';
  }

  function setLoading(btnId, loading) {
    document.getElementById(btnId).disabled = loading;
    document.getElementById(btnId).textContent = loading ? 'Please wait…' : {
      signinBtn: 'Sign in',
      signupBtn: 'Create my portfolio',
      forgotBtn: 'Send reset link'
    }[btnId];
  }

  function friendlyError(code) {
    var map = {
      'auth/user-not-found':      'No account found with that email.',
      'auth/wrong-password':      'Incorrect password. Try again or reset it.',
      'auth/invalid-credential':  'Incorrect email or password.',
      'auth/email-already-in-use':'An account already exists with that email.',
      'auth/weak-password':       'Password must be at least 8 characters.',
      'auth/invalid-email':       'Please enter a valid email address.',
      'auth/too-many-requests':   'Too many attempts. Please wait a moment and try again.',
      'auth/network-request-failed':   'Network error — check your connection and try again.',
      'auth/operation-not-allowed':    'Sign-up is not enabled yet. Please contact the site owner.',
      'auth/popup-blocked':            'Popup was blocked by your browser. Allow popups and try again.',
      'auth/requires-recent-login':    'Session expired. Please sign in again.'
    };
    return map[code] || ('Something went wrong (' + (code || 'unknown') + '). Please try again.');
  }

  /* ── Sign in ── */
  function doSignin(e) {
    e.preventDefault();
    clearMsg('signinMsg');
    var email    = document.getElementById('signinEmail').value.trim();
    var password = document.getElementById('signinPassword').value;

    setLoading('signinBtn', true);
    firebase.auth().signInWithEmailAndPassword(email, password)
      .then(function (cred) {
        if (!cred.user.emailVerified) {
          lastSignupUser = cred.user;
          firebase.auth().signOut();
          setVerifyView('Please verify your email before signing in. Check your inbox or resend the link below.');
          return;
        }
        window.location.href = (cred.user.email === 'pandeyanubhav229@gmail.com')
          ? 'admin.html'
          : 'dashboard.html';
      })
      .catch(function (err) {
        setMsg('signinMsg', friendlyError(err.code));
        setLoading('signinBtn', false);
      });
  }

  /* ── Sign up ── */
  function doSignup(e) {
    e.preventDefault();
    clearMsg('signupMsg');
    var email    = document.getElementById('signupEmail').value.trim();
    var password = document.getElementById('signupPassword').value;
    var confirm  = document.getElementById('signupConfirm').value;

    if (password !== confirm) {
      setMsg('signupMsg', 'Passwords do not match.');
      return;
    }
    if (password.length < 8) {
      setMsg('signupMsg', 'Password must be at least 8 characters.');
      return;
    }

    setLoading('signupBtn', true);
    firebase.auth().createUserWithEmailAndPassword(email, password)
      .then(function (cred) {
        lastSignupUser = cred.user;
        return cred.user.sendEmailVerification();
      })
      .then(function () {
        firebase.auth().signOut();
        setVerifyView('We sent a verification link to ' + email + '. Click it to activate your account, then sign in.');
      })
      .catch(function (err) {
        setMsg('signupMsg', friendlyError(err.code));
        setLoading('signupBtn', false);
      });
  }

  /* ── Forgot password ── */
  function doResetPassword(e) {
    e.preventDefault();
    clearMsg('forgotMsg');
    var email = document.getElementById('forgotEmail').value.trim();
    setLoading('forgotBtn', true);
    firebase.auth().sendPasswordResetEmail(email)
      .then(function () {
        setMsg('forgotMsg', 'Reset link sent — check your inbox.', 'success');
        setLoading('forgotBtn', false);
      })
      .catch(function (err) {
        setMsg('forgotMsg', friendlyError(err.code));
        setLoading('forgotBtn', false);
      });
  }

  /* ── Resend verification ── */
  function doResend() {
    if (!lastSignupUser) {
      document.getElementById('verifyDesc').textContent = 'Please sign in first, then we can resend the verification email.';
      return;
    }
    document.getElementById('resendBtn').disabled = true;
    lastSignupUser.sendEmailVerification()
      .then(function () {
        document.getElementById('verifyDesc').textContent = 'Verification email sent again — check your inbox.';
        setTimeout(function () { document.getElementById('resendBtn').disabled = false; }, 30000);
      })
      .catch(function () {
        document.getElementById('verifyDesc').textContent = 'Could not resend — please try signing up again.';
      });
  }
</script>
</body>
</html>
